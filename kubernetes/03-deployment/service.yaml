# Service to expose the Deployment.
# selector matches the deployment pod label: app=landmark-app
# LoadBalancer type provisions an external ELB on AWS.
apiVersion: v1
kind: Service
metadata:
  name: landmark-app-service
  namespace: landmark
spec:
  type: LoadBalancer
  selector:
    app: landmark-app
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
